name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build
      run: |
        npm install
        npx webpack
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: linkswelle-institut-b1-quiz/package-lock.json

      - name: Install dependencies
        working-directory: linkswelle-institut-b1-quiz
        run: npm install

      - name: Build web app
        working-directory: linkswelle-institut-b1-quiz
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: linkswelle-institut-b1-quiz
        run: npx cap sync android

      - name: Build APK
        working-directory: linkswelle-institut-b1-quiz/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Linkswelle-B1-Quiz-APK
          path: linkswelle-institut-b1-quiz/android/app/build/outputs/apk/debug/app-debug.apk
